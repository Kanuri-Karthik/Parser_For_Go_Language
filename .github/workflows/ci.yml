name: CI — Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v -o parser-linux ./...

      - name: Run tests
        run: go test -v -timeout 60s ./...

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: parser-linux
          path: parser-linux

  # ─────────────────────────────────────────────
  # Job 2: Cross-compile for multiple platforms
  # ─────────────────────────────────────────────
  cross-compile:
    name: Cross-compile (${{ matrix.os }})
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: parser-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            artifact: parser-macos-amd64
          - goos: darwin
            goarch: arm64
            artifact: parser-macos-arm64
          - goos: linux
            goarch: amd64
            artifact: parser-linux-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ─────────────────────────────────────────────
  # Job 3: Create GitHub Release (on tag push)
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Robust Go Parser & AST Engine — ${{ github.ref_name }}

            ### Downloads

            | Platform | Binary |
            |----------|--------|
            | Windows (amd64) | `parser-windows-amd64.exe` |
            | macOS (Intel) | `parser-macos-amd64` |
            | macOS (Apple Silicon) | `parser-macos-arm64` |
            | Linux (amd64) | `parser-linux-amd64` |

            ### Quick Start
            ```bash
            # Web playground
            ./parser -serve :8080

            # Interactive REPL
            ./parser -repl

            # Parse a file
            ./parser -ast yourfile.go

            # Evaluate inline expression
            ./parser -code "2 + 3 * 4"
            ```
          files: release-artifacts/**
          draft: false
          prerelease: false
